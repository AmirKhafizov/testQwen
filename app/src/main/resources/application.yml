spring:
  application:
    name: cost-monitor
  datasource:
    url: jdbc:postgresql://localhost:5432/cost_monitor
    username: cost_monitor
    password: cost_monitor
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    com.construction.costmonitor: DEBUG

# Custom
app:
  lemana:
    base-url: https://kazan.lemanapro.ru
    request-delay-ms: 1500
    user-agent: Mozilla/5.0 (compatible; CostMonitor/0.1)
