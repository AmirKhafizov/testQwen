spring:
  application:
    name: cost-monitor
  datasource:
    url: jdbc:postgresql://localhost:5432/cost_monitor
    username: cost_monitor
    password: cost_monitor
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: false

logging:
  level:
    root: INFO
    com.construction.costmonitor: DEBUG

# Custom
app:
  lemana:
    base-url: https://kazan.lemanapro.ru
    request-delay-ms: 2000
    user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
    headless: true
    navigation-timeout-ms: 45000
  scheduler:
    price-update-enabled: true
    # Every day at 10:00 Europe/Moscow
    price-update-cron: "0 0 10 * * *"
    price-update-zone: Europe/Moscow
